services:
  complaint-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RAG_SERVICE_URL=http://rag-service:8002
    depends_on:
      - rag-service

  rag-service:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - COMPLAINT_API_URL=http://complaint-api:8001
      - RAG_SERVICE_URL=http://rag-service:8002
    depends_on:
      - complaint-api
      - rag-service
